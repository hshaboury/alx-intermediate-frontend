<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Page</title>
</head>
<body>

    <!-- Header Section -->
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main>
        <article>
            <h1>Main Title of the Article</h1>
            <section>
                <p>This is the main content section of the article.</p>
            </section>
        </article>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>@copyright</p>
    </footer>

</body>
</html>
